# Herramientas expuestas al LLM (function calling). Esquema y valores permitidos: catalogo/_ESQUEMA.md.
# Migrado desde la WHITELIST de src/executor.py (P8) sin cambiar plantillas, descripciones ni enums.
version: 1
entradas:
  - id: get_defender_status
    titulo: "Estado general de Windows Defender"
    descripcion_llm: >-
      Consulta el estado general de Windows Defender (protección en tiempo real, servicio, firmas,
      últimos análisis).
    justificacion: >-
      Lectura base para responder «¿cómo está mi PC?»: servicio, protección en tiempo real,
      antigüedad de las firmas y últimos análisis.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-MpComputerStatus | Select-Object AMServiceEnabled, AntispywareEnabled, AntivirusEnabled,
      RealTimeProtectionEnabled, NISEnabled, AntivirusSignatureLastUpdated,
      AntispywareSignatureLastUpdated, QuickScanEndTime, FullScanEndTime, ComputerState |
      ConvertTo-Json
    area: defender
    timeout_s: 15

  - id: get_detected_threats
    titulo: "Amenazas detectadas por Defender"
    descripcion_llm: "Lista las amenazas detectadas por Windows Defender."
    justificacion: >-
      Permite explicar qué ha detectado Defender y cuándo. Los nombres y rutas de las amenazas
      pueden revelar ficheros del usuario, de ahí la sensibilidad personal.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: personal
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: "Get-MpThreatDetection | ConvertTo-Json -Depth 3"
    area: malware
    timeout_s: 15

  - id: get_firewall_status
    titulo: "Estado de los perfiles del firewall"
    descripcion_llm: >-
      Consulta el estado (activado/desactivado) de los perfiles del firewall de Windows, si las
      conexiones entrantes están bloqueadas por completo (AllowInboundRules) y si el firewall
      notifica al bloquear una app (NotifyOnListen).
    justificacion: >-
      Diagnostica la exposición de red: perfiles activos, bloqueo total de entrantes y avisos al
      bloquear una app.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-NetFirewallProfile | Select-Object Name, Enabled, AllowInboundRules, NotifyOnListen |
      ConvertTo-Json
    area: red
    timeout_s: 15

  - id: get_active_network_profile
    titulo: "Perfil de red activo"
    descripcion_llm: >-
      Consulta qué perfil de red (Dominio/Privada/Pública) está activo ahora mismo y en qué red,
      complementando el estado de los tres perfiles del firewall.
    justificacion: >-
      Indica qué perfil del firewall se aplica realmente ahora mismo. El nombre de la red puede ser
      identificativo, de ahí la sensibilidad personal.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: personal
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-NetConnectionProfile | Select-Object Name, InterfaceAlias, NetworkCategory |
      ConvertTo-Json
    area: red
    timeout_s: 15

  - id: start_quick_scan
    titulo: "Análisis rápido"
    descripcion_llm: "Inicia un análisis rápido de Windows Defender."
    justificacion: >-
      Acción acotada y cancelable que no modifica la configuración; requiere confirmación humana y
      terminal elevada.
    tipo: herramienta
    nivel: accion
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: "Start-MpScan -ScanType QuickScan"
    area: malware
    timeout_s: 600

  - id: update_signatures
    titulo: "Actualizar firmas de Defender"
    descripcion_llm: "Actualiza las firmas de virus de Windows Defender."
    justificacion: >-
      Mantiene al día la detección sin riesgo de pérdida de datos; requiere confirmación humana y
      terminal elevada.
    tipo: herramienta
    nivel: accion
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: "Update-MpSignature"
    area: actualizaciones
    timeout_s: 120

  - id: set_firewall_profile
    titulo: "Activar o desactivar un perfil del firewall"
    descripcion_llm: "Activa o desactiva un perfil concreto del firewall de Windows."
    justificacion: >-
      Mutación sobre el firewall (Tamper Protection no lo bloquea, a diferencia de Set-MpPreference,
      que por eso no está en el catálogo). Parámetros cerrados a los tres perfiles y a True/False.
    tipo: herramienta
    nivel: mutante
    riesgo: alto
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: "Set-NetFirewallProfile -Profile {profile} -Enabled {enabled}"
    parametros:
      profile: ["Domain", "Private", "Public"]
      enabled: ["True", "False"]
    area: red
    timeout_s: 30

  - id: set_block_all_incoming
    titulo: "Bloquear todas las conexiones entrantes"
    descripcion_llm: >-
      Bloquea o permite TODAS las conexiones entrantes en un perfil del firewall de Windows. Poner
      allow_inbound_rules en 'False' bloquea absolutamente todas las conexiones entrantes, incluidas
      las de las apps de la lista de permitidas — es la opción 'Bloquea todas las conexiones
      entrantes, incluidas las de la lista de apps permitidas' de la configuración de Windows. Poner
      'True' restaura el comportamiento normal (se respeta la lista de apps permitidas).
    justificacion: >-
      Equivale a la opción de Windows «Bloquea todas las conexiones entrantes». Parámetros cerrados
      a los tres perfiles y a True/False.
    tipo: herramienta
    nivel: mutante
    riesgo: alto
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: "Set-NetFirewallProfile -Profile {profile} -AllowInboundRules {allow_inbound_rules}"
    parametros:
      profile: ["Domain", "Private", "Public"]
      allow_inbound_rules: ["True", "False"]
    area: red
    timeout_s: 30

  - id: remove_all_threats
    titulo: "Eliminar todas las amenazas detectadas"
    descripcion_llm: "Elimina todas las amenazas detectadas actualmente por Windows Defender."
    justificacion: "Mutante porque la eliminación no se puede deshacer; confirmación humana obligatoria."
    tipo: herramienta
    nivel: mutante
    riesgo: alto
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: "Remove-MpThreat"
    area: malware
    timeout_s: 60

  - id: get_account_info
    titulo: "Cuenta de Windows en uso"
    descripcion_llm: >-
      Consulta el nombre de la cuenta de Windows con la que se ha iniciado sesión y si pertenece al
      grupo de administradores locales.
    justificacion: >-
      Única herramienta del grupo «Account protection» de Windows Security. El resto del grupo
      (Windows Hello, Dynamic lock, cuenta Microsoft) no tiene cmdlets oficiales equivalentes a
      Get/Set-MpPreference o Get/Set-NetFirewallProfile, y roza la regla «sin credenciales» al
      tratarse de factores de autenticación. Detalle en docs/cobertura_windows_security.md. Devuelve
      el nombre de usuario, de ahí la sensibilidad personal.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: personal
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      $p = New-Object
      Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent());
      [PSCustomObject]@{ Usuario = $p.Identity.Name; EsAdministradorLocal =
      $p.IsInRole([Security.Principal.WindowsBuiltinRole]::Administrator) } | ConvertTo-Json
    area: cuentas
    timeout_s: 15

  - id: start_full_scan
    titulo: "Análisis completo"
    descripcion_llm: "Inicia un análisis completo de Windows Defender sobre todo el equipo."
    justificacion: >-
      Acción cancelable que no modifica la configuración; requiere confirmación humana y terminal
      elevada. Tiempo máximo amplio porque un análisis completo dura horas.
    tipo: herramienta
    nivel: accion
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: "Start-MpScan -ScanType FullScan"
    area: malware
    timeout_s: 3600

  - id: start_custom_scan
    titulo: "Análisis de una carpeta de usuario"
    descripcion_llm: >-
      Inicia un análisis de Windows Defender sobre una carpeta de usuario predefinida (Descargas,
      Escritorio o Documentos).
    justificacion: >-
      La ruta nunca viene del LLM: el parámetro es una clave de un enum cerrado (Descargas,
      Escritorio, Documentos) y la ruta real se resuelve dentro de la plantilla fija.
    tipo: herramienta
    nivel: accion
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: >-
      $rutas = @{{ 'Descargas' = "$env:USERPROFILE\Downloads"; 'Escritorio' =
      "$env:USERPROFILE\Desktop"; 'Documentos' = "$env:USERPROFILE\Documents" }}; Start-MpScan
      -ScanType CustomScan -ScanPath $rutas['{ruta}']
    parametros:
      ruta: ["Descargas", "Escritorio", "Documentos"]
    area: malware
    timeout_s: 900

  - id: get_allowed_threats
    titulo: "Amenazas permitidas por el usuario"
    descripcion_llm: >-
      Consulta las amenazas que el usuario ha permitido explícitamente en Windows Defender.
    justificacion: >-
      Get-MpThreatCatalog se descartó tras comprobarlo en real: es el catálogo completo de
      definiciones de amenazas de Defender (no las excepciones permitidas por el usuario) y lanzó
      OutOfMemoryException tras más de 120 s. Get-MpPreference sí expone directamente las
      excepciones del usuario en ThreatIDDefaultAction_Ids/Actions, de forma inmediata.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-MpPreference | Select-Object ThreatIDDefaultAction_Ids, ThreatIDDefaultAction_Actions |
      ConvertTo-Json
    area: defender
    timeout_s: 15

  - id: get_defender_exclusions
    titulo: "Exclusiones de Defender"
    descripcion_llm: >-
      Consulta las exclusiones configuradas actualmente en Windows Defender (rutas, extensiones y
      procesos).
    justificacion: >-
      Comprobado en real: sin terminal elevada, Get-MpPreference devuelve el texto «N/A: Must be an
      administrator to view exclusions» en vez de las exclusiones. Exigir administrador evita tratar
      ese marcador como si fueran datos. Las rutas excluidas pueden ser personales.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: personal
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: >-
      Get-MpPreference | Select-Object ExclusionPath, ExclusionExtension, ExclusionProcess |
      ConvertTo-Json
    area: defender
    timeout_s: 15

  - id: get_defender_preferences
    titulo: "Ajustes de protección de Defender"
    descripcion_llm: >-
      Consulta ajustes de protección de Windows Defender: Controlled Folder Access, protección en la
      nube, envío automático de muestras y si el bloqueo de aplicaciones potencialmente no deseadas
      (PUA) está activo.
    justificacion: >-
      No incluye «Dev Drive protection»: comprobado con Get-Member sobre Get-MpPreference en la
      versión de Defender instalada y el campo no existe en esta instalación.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-MpPreference | Select-Object EnableControlledFolderAccess, MAPSReporting,
      SubmitSamplesConsent, PUAProtection | ConvertTo-Json
    area: defender
    timeout_s: 15

  - id: get_exploit_protection_status
    titulo: "Exploit Protection del sistema"
    descripcion_llm: >-
      Consulta la configuración de Exploit Protection a nivel de sistema (DEP, ASLR, CFG, SEHOP y el
      resto de mitigaciones que expone Get-ProcessMitigation).
    justificacion: >-
      Cubre el apartado Exploit Protection de «App & browser control» con el cmdlet oficial
      Get-ProcessMitigation, solo lectura.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: "Get-ProcessMitigation -System | ConvertTo-Json -Depth 4"
    area: sistema
    timeout_s: 30

  - id: get_allowed_firewall_rules
    titulo: "Reglas de entrada permitidas del firewall"
    descripcion_llm: >-
      Consulta de solo lectura de las reglas de entrada actualmente habilitadas y permitidas en el
      firewall de Windows (nombre visible de la regla y perfil al que aplica). No crea, habilita ni
      deshabilita ninguna regla.
    justificacion: >-
      Solo lectura: no crea, habilita ni deshabilita reglas. Devuelve únicamente nombre visible y
      perfil de cada regla.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-NetFirewallRule -Direction Inbound -Action Allow -Enabled True | Select-Object
      DisplayName, Profile | ConvertTo-Json
    area: red
    timeout_s: 20

  - id: restore_firewall_defaults
    titulo: "Restaurar el firewall a valores de fábrica"
    descripcion_llm: >-
      ACCIÓN DE ALTO IMPACTO: restaura TODAS las reglas del firewall de Windows a los valores de
      fábrica, incluidas las reglas personalizadas que el usuario haya creado fuera de ProtexiumAI.
      No se puede deshacer.
    justificacion: >-
      Mutante de alto impacto y sin vuelta atrás. `| Out-Null` silencia la salida de netsh porque el
      parseo del executor trata cualquier stdout no vacío como JSON obligatorio y `netsh advfirewall
      reset` puede imprimir texto de confirmación en algunas versiones de Windows.
    tipo: herramienta
    nivel: mutante
    riesgo: alto
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: "netsh advfirewall reset | Out-Null"
    area: red
    timeout_s: 60

  - id: get_core_isolation_status
    titulo: "Core isolation (integridad de memoria)"
    descripcion_llm: >-
      Consulta el estado de Core isolation (integridad de memoria/HVCI, Credential Guard, System
      Guard) mediante la clase WMI oficial de Device Guard.
    justificacion: >-
      Pertenece al grupo «Device security» de Windows Security; se consulta con la clase WMI oficial
      de Device Guard, solo lectura.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-CimInstance -Namespace root\Microsoft\Windows\DeviceGuard -ClassName Win32_DeviceGuard |
      ConvertTo-Json -Depth 3
    area: dispositivo
    timeout_s: 15

  - id: get_secure_boot_status
    titulo: "Arranque seguro (Secure Boot)"
    descripcion_llm: "Consulta si el arranque seguro (Secure Boot) está activo."
    justificacion: >-
      Comprobado en real: Confirm-SecureBootUEFI sin administrador no lanza la excepción de BIOS
      heredado que motivó el try/catch, sino «Acceso denegado»; el try/catch la captura y devuelve
      JSON válido con SecureBootEnabled=null, ocultando el valor real. Exigir administrador evita
      devolver ese marcador como si fueran datos.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: >-
      try { [PSCustomObject]@{ SecureBootEnabled = (Confirm-SecureBootUEFI) } | ConvertTo-Json }
      catch { [PSCustomObject]@{ SecureBootEnabled = $null; Error = $_.Exception.Message } |
      ConvertTo-Json }
    area: dispositivo
    timeout_s: 15

  - id: get_tpm_status
    titulo: "Procesador de seguridad (TPM)"
    descripcion_llm: >-
      Consulta el estado del procesador de seguridad (TPM): si está presente, listo, activado y su
      fabricante/versión.
    justificacion: >-
      Comprobado en real: sin administrador, Get-Tpm no falla, sino que devuelve los seis campos a
      null (JSON válido sin ningún dato real). Exigir administrador evita tratar ese relleno como el
      estado real del TPM.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: >-
      Get-Tpm | Select-Object TpmPresent, TpmReady, TpmEnabled, TpmActivated, ManufacturerIdTxt,
      ManufacturerVersion | ConvertTo-Json
    area: dispositivo
    timeout_s: 15

  - id: get_bitlocker_status
    titulo: "Cifrado de dispositivo (BitLocker)"
    descripcion_llm: >-
      Consulta el estado de cifrado de dispositivo (BitLocker) de los volúmenes del equipo.
    justificacion: >-
      Comprobado en real: sin administrador, Get-BitLockerVolume falla con «Acceso denegado» y no
      produce stdout, que se normalizaría como lista vacía e indistinguible de «sin volúmenes
      BitLocker». Exigir administrador evita ese falso negativo.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: admin}
    motor: powershell
    plantilla: >-
      Get-BitLockerVolume | Select-Object MountPoint, VolumeStatus, ProtectionStatus,
      EncryptionPercentage | ConvertTo-Json
    area: dispositivo
    timeout_s: 15

  - id: get_storage_status
    titulo: "Espacio de almacenamiento"
    descripcion_llm: "Consulta el espacio libre y total de las unidades de almacenamiento del equipo."
    justificacion: >-
      Solo lectura de espacio libre y total por unidad. La etiqueta del volumen puede contener
      nombres personales, de ahí la sensibilidad personal.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: personal
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-Volume | Where-Object { $_.DriveLetter } | Select-Object DriveLetter, FileSystemLabel,
      SizeRemaining, Size | ConvertTo-Json
    area: sistema
    timeout_s: 15

  - id: get_battery_status
    titulo: "Estado de la batería"
    descripcion_llm: >-
      Consulta el estado y la carga estimada de la batería. Si el equipo es de sobremesa y no tiene
      batería, la consulta no falla: no hay salida de PowerShell y el resultado es data=None, que
      debe explicarse al usuario como 'este equipo no tiene batería', nunca como un error o un fallo
      de la herramienta.
    justificacion: >-
      Comprobado en real: en un equipo sin batería, Get-CimInstance Win32_Battery no produce stdout
      (ni error ni JSON vacío). El executor lo interpreta como data=None, que el agente debe
      explicar como «este equipo no tiene batería», no como un fallo.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: >-
      Get-CimInstance -ClassName Win32_Battery | Select-Object EstimatedChargeRemaining,
      BatteryStatus | ConvertTo-Json
    area: sistema
    timeout_s: 15

  - id: get_time_service_status
    titulo: "Servicio de hora de Windows"
    descripcion_llm: >-
      Consulta si el servicio de hora de Windows (sincronización del reloj del sistema) está en
      ejecución.
    justificacion: >-
      Solo lectura del estado del servicio W32Time, del que depende la validez de certificados y
      registros.
    tipo: herramienta
    nivel: lectura
    riesgo: bajo
    sensibilidad: tecnica
    perfiles: [hogar, sistemas]
    plataforma: {so: windows}
    requisitos: {privilegios: usuario}
    motor: powershell
    plantilla: "Get-Service -Name W32Time | Select-Object Status, StartType | ConvertTo-Json"
    area: sistema
    timeout_s: 15
